<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101114'/%3E%3Crect x='5' y='5' width='10' height='10' rx='2' fill='%235b9df0'/%3E%3Crect x='17' y='5' width='10' height='10' rx='2' fill='%2343c7a6'/%3E%3Crect x='5' y='17' width='10' height='10' rx='2' fill='%23e3a94a'/%3E%3Crect x='17' y='17' width='10' height='10' rx='2' fill='%23b58bec'/%3E%3C/svg%3E"
    />
    <title>Chord Session — an instant-play chord instrument</title>
    <meta
      name="description"
      content="Press a chord pad to hear a live piano-and-bass chord and build a progression, right in the browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <nav aria-label="Primary">
          <a href="./">Home</a>
        </nav>
        <h1 class="topbar__title">Chord Session</h1>
        <button type="button" id="clear-button" class="ghost-button">Clear</button>
      </header>

      <main>
        <section class="panel progression" aria-label="Progression">
          <ol id="progression-list" class="progression__list"></ol>
        </section>

        <section class="panel pads" aria-label="Choose a chord">
          <div id="pad-grid" class="pads__grid" role="group" aria-label="Chord pads"></div>
        </section>

        <section class="status" aria-label="Status">
          <p id="status-line" class="status__line"></p>
        </section>
      </main>

      <p id="sr-announcer" class="visually-hidden" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
